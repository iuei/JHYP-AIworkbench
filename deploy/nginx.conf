# ============================================================================
# JHYP 智能工作台 —— Nginx 站点配置
#
# 放在服务器的：/etc/nginx/conf.d/jhyp.conf
# 需要你自己改的地方只有两处（都标了「★改这里」）：
#   1. server_name            你的域名（没域名就先别看第一块，用第二块 8080）
#   2. root 的静态目录        默认 /srv/jhyp/app/dist，与部署文档一致就不用改
#
# 里面有两个 server 块，按你的情况**只用一个**，另一个整块删掉或注释掉：
#   第一块：443（HTTPS + 域名）—— 需要先完成 ICP 备案并上传 SSL 证书
#   第二块：8080（http + 公网 IP）—— 还没备案 / 还没域名时的临时入口
# ============================================================================

# 后端服务（Node，只监听本机，不对外暴露）
upstream jhyp_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 第一块：正式域名 + HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    # ★改这里：你的域名
    server_name ai.example.com;

    # 阿里云免费证书申请时会要求验证域名，验证通过后可把 80 永久跳转到 443
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 最兼容写法：不支持 HTTP/2 也不影响使用。
    # 如果你的 nginx 是 1.25.1 及以上，可改成：listen 443 ssl; http2 on;
    # 判断版本：nginx -v ；不确定就保持现在这样（绝对不会报错）
    listen 443 ssl;
    # ★改这里：你的域名（要和上面一致）
    server_name ai.example.com;

    # ★改这里：证书路径。阿里云「数字证书管理服务」下载 Nginx 版证书后上传到这两个路径
    ssl_certificate     /etc/nginx/ssl/ai.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ai.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件（Vite 构建产物）
    root /srv/jhyp/app/dist;
    index index.html;

    # CSV 导入 / 文件上传可能几十 MB，默认 1m 会被 Nginx 直接拒掉（413）
    client_max_body_size 64m;

    # 安全响应头（不影响功能，建议保留）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------- 后端接口 ----------------
    location /api/ {
        proxy_pass http://jhyp_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ↓↓↓ AI 问答是 SSE 流式返回，下面几行是关键：缺了就会「转圈很久然后一次性出全文」
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        # ↑↑↑

        # 模型回答可能超过 60 秒，默认 60s 会被 Nginx 掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # ---------------- 前端页面（SPA 路由回退）----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带哈希，改内容必然换名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

