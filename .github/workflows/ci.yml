name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      # 后端全量测试（node:test）此前不在 CI 里跑，本地一旦"只跑相关测试"就会失去兜底，
      # 因此把全量后端测试固定在这里：本地按需跑 test:server:changed，全量交给 CI 与提交前。
      - name: Run server tests
        run: pnpm run test:server

      - name: Build the project
        run: pnpm build
